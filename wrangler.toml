name = "open-resume"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# 绑定 Cloudflare D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "open-resume-db"
database_id = "b02dc9bb-ae89-49eb-bae1-a304c4a0a83a"

# 绑定 Cloudflare R2 对象存储桶 (如在控制台开通了 R2 可解除注释)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "open-resume-assets"
# preview_bucket_name = "open-resume-assets-dev"

[vars]
JWT_SECRET = "open-resume-dev-secret-key-change-in-prod"
