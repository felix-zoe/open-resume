name = "open-resume"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# 运行时环境变量
# ---------------------------------------------------------------------------
# JWT_SECRET 用于签发与校验登录 Token（HS256）。
# 服务端在缺失时**直接失败**（HTTP 500 / code 50003），不会回退到硬编码默认值，
# 因此部署前必须确保这个值存在。
#
# ⚠️ 安全提示：本文件受版本控制，这里的密钥会随仓库一起公开。
#    · 仅供本地开发 / 私有部署使用；
#    · 开源仓库或生产环境请改用 Secret 注入：
#        npx wrangler secret put JWT_SECRET
#      同名 Secret 会覆盖 [vars] 中的明文值，因此注入后建议删除下方这一行，
#      避免“以为用的是 Secret，实际仍是仓库里的明文”的错觉。
#    · 轮换密钥会使所有已签发的 Token 立即失效（用户需重新登录）。
#
# 本地覆盖：如需使用另一套密钥，创建 .dev.vars（已被 .gitignore 忽略）并写入
#   JWT_SECRET=你的本地密钥
# `npm run cf:dev` 通过 --binding 传入的本地密钥会覆盖此处的值。
[vars]
JWT_SECRET = "ZHrkdXH_BEShi6E9Yd-pSuDGve8ntpfzCpsje5QMPy9vsvk6jbY4Xa9Zucq89Fae"

# ---------------------------------------------------------------------------
# 绑定
# ---------------------------------------------------------------------------
# D1 数据库：用户、简历、访问统计
[[d1_databases]]
binding = "DB"
database_name = "open-resume-db"
database_id = "b02dc9bb-ae89-49eb-bae1-a304c4a0a83a"

# R2 对象存储：求职照片等上传文件
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "common-bucket"
preview_bucket_name = "common-bucket"
