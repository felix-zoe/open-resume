name = "open-resume"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# 绑定 Cloudflare D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "open-resume-db"
database_id = "b02dc9bb-ae89-49eb-bae1-a304c4a0a83a"

# 绑定 Cloudflare R2 对象存储桶 (已开通 common-bucket)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "common-bucket"
preview_bucket_name = "common-bucket"

# 绑定 Cloudflare Browser Run (Headless Chromium 渲染服务)
[browser]
binding = "MYBROWSER"

# 生产安全环境变量：建议通过 `npx wrangler secret put JWT_SECRET` 注入安全密钥
# 本地开发可创建 .dev.vars 文件并写入 JWT_SECRET=xxx
[vars]
# JWT_SECRET = ""

