name: Alerts

# 每日跑一次可观测性阈值检查（T5.6）。
#
# 为什么不挂在 ci.yml 里：告警看的是**线上**数据，而 CI 跑的是代码检查。
# 两者失败的含义完全不同（一个是「这次提交有问题」，一个是「昨天线上不对」），
# 混在一个工作流里会让人分不清红叉该找谁。
#
# 需要的 Secrets：
#   CLOUDFLARE_API_TOKEN  —— 有 D1 读权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 账号 ID
on:
  schedule:
    # 每天 UTC 01:10（北京时间 09:10）——上班后第一眼能看到
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alerts:
    name: 指标阈值检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 退出码非 0 即视为超阈值，工作流变红
      - name: 检查最近 1 天指标
        run: npm run check:alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 数据保留：与隐私政策「运行指标保留 90 天」一致
      - name: 清理过期数据
        run: npm run db:purge:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
