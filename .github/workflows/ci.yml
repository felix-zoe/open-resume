name: CI

# 触发策略：
# · pull_request —— 每个 PR 必须过质量门禁才能合并；
# · push 到 main —— 防止直接推送绕过检查；
# · 手动 —— 排查线上问题时可以按需重跑。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交取消上一次运行，避免排队浪费额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 顺序刻意是「快 → 慢」：静态守卫 1 秒内失败，不必等到构建
      - name: 静态守卫
        run: npm run check:static

      - name: 类型检查
        run: npm run typecheck

      - name: 单元与组件测试
        run: npm run test:unit:run

      - name: 构建
        run: npm run build

      # 首次运行需下载浏览器；缓存后可省 ~30s
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      # CI 里没有系统 Chrome，统一用 Playwright 自带 Chromium（PW_CHANNEL=bundled）
      - name: E2E
        run: npm run test:e2e
        env:
          CI: 'true'
          PW_CHANNEL: bundled

      - name: 上传失败用例的 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
